name: metrica-platform

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - metrica

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMq__User:-events}
      RABBITMQ_DEFAULT_PASS: ${RabbitMq__Password:-rabbitmq-local-password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - metrica

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - metrica

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - metrica

  api-event:
    build:
      context: .
      dockerfile: src/EventService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EventsDb: ${ConnectionStrings__EventsDb:-Host=db;Port=5432;Database=events_db;Username=events_app;Password=events-local-password}
      RabbitMq__Host: ${RabbitMq__Host:-rabbitmq}
      RabbitMq__User: ${RabbitMq__User:-events}
      RabbitMq__Password: ${RabbitMq__Password:-rabbitmq-local-password}
      Redis__ConnectionString: ${Redis__ConnectionString:-redis:6379,abortConnect=false,connectTimeout=200}
      Jwt__Issuer: ${Jwt__Issuer:-events-platform-local}
      Jwt__Audience: ${Jwt__Audience:-events-api}
      Jwt__SigningKey: ${Jwt__SigningKey:-local-development-signing-key-change-me-32-bytes-minimum}
      Database__ApplyMigrationsOnStartup: ${Database__ApplyMigrationsOnStartup:-true}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-http://localhost:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "5001:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - metrica

  api-notifications:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NotificationsDb: ${ConnectionStrings__NotificationsDb:-Host=db;Port=5432;Database=notifications_db;Username=notifications_app;Password=notifications-local-password}
      RabbitMq__Host: ${RabbitMq__Host:-rabbitmq}
      RabbitMq__User: ${RabbitMq__User:-events}
      RabbitMq__Password: ${RabbitMq__Password:-rabbitmq-local-password}
      Jwt__Issuer: ${Jwt__Issuer:-events-platform-local}
      Jwt__Audience: ${Jwt__Audience:-events-api}
      Jwt__SigningKey: ${Jwt__SigningKey:-local-development-signing-key-change-me-32-bytes-minimum}
      Smtp__Host: ${Smtp__Host:-mailpit}
      Smtp__Port: ${Smtp__Port:-1025}
      Notifications__Email__To: ${Notifications__Email__To:-operaciones@example.com}
      Database__ApplyMigrationsOnStartup: ${Database__ApplyMigrationsOnStartup:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "5002:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - metrica

  web:
    build:
      context: ./frontend/web-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001}
    ports:
      - "3000:8080"
    depends_on:
      api-event:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - metrica

  jaeger:
    image: jaegertracing/jaeger:latest
    profiles:
      - observability
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
    restart: unless-stopped
    networks:
      - metrica

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:

networks:
  metrica:
    driver: bridge
